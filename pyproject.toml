[project]
name = "recon"
version = "1.0.0"
description = "Deterministic bank reconciliation engine for Secontrol Automatización SA de CV"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pdfplumber>=0.11",
    "PyYAML>=6.0",
    "pydantic>=2.0",
    "rapidfuzz>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
recon = "recon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
